name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ne fonctionnera qu'une fois @agenteca/cli publié sur npm.
      - run: npm install -g @agenteca/cli@0.1
      - name: Scan de sécurité des paquets du dépôt
        run: ahub scan . --format sarif --output ahub.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ahub.sarif
          category: ahub
      - name: Refuse tout constat critique
        run: ahub scan .
      - name: Le paquet d'exemple s'installe et se retire sur les quatre outils
        run: scripts/check-example.sh
      - name: Les marketplaces natifs sont à jour
        run: scripts/export.sh && git diff --exit-code
