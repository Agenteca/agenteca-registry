# Official starter catalog of Agenteca.
# The `marketplace:` block is the standard OpenAPM format (spec §4.7): this repository
# serves as a registry for `ahub` and `apm`, with no format of its own.
#
#   ahub registry add agenteca/agenteca-registry
#   ahub search
name: agenteca-registry
version: 0.1.0
description: Official starter catalog of Agenteca.
license: Apache-2.0

marketplace:
  name: agenteca
  description: Official starter catalog of Agenteca.
  owner:
    name: Agenteca
    url: https://github.com/agenteca
  packages:
    - name: hello-agent
      source: ./examples/hello-agent
      description: Example package — a skill, an agent, a command, an instruction, a hook and an MCP server, installable in all four tools.
      license: Apache-2.0
      category: examples
      tags: [example, getting-started]
      tools: [claude, codex, copilot, cursor]

    - name: agenteca-project-kit
      source: agenteca/agenteca-agents/plugins/agenteca-project-kit
      description: Agents and skills for building a multi-repository open-source project - standards first, an approved plan, versioned contracts, honest verification, a guided first release.
      license: Apache-2.0
      category: development
      tags: [planning, architecture, release, verification]
      tools: [claude, codex, copilot, cursor]
      nativePlugin: true

    # The Agenteca plugins themselves: each one only exists for its own tool.
    - name: agenteca-claude-code
      source: agenteca/agenteca-claude-code
      description: Agenteca plugin for Claude Code (/hub command and MCP server).
      license: Apache-2.0
      category: tools
      tags: [agenteca, plugin]
      tools: [claude]
      nativePlugin: true
    - name: agenteca-codex
      source: agenteca/agenteca-codex
      description: Agenteca plugin for Codex (hub skill and MCP server).
      license: Apache-2.0
      category: tools
      tags: [agenteca, plugin]
      tools: [codex]
      nativePlugin: true
    - name: agenteca-copilot
      source: agenteca/agenteca-copilot
      description: Agenteca plugin for GitHub Copilot CLI (hub skill and MCP server).
      license: Apache-2.0
      category: tools
      tags: [agenteca, plugin]
      tools: [copilot]
      nativePlugin: true
