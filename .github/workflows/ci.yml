name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-core
          path: agenteca-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-cli
          path: agenteca-cli
      - uses: actions/checkout@v4
        with:
          path: agenteca-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Agenteca repositories are linked through an npm workspace, as in development.
      - name: Workspace
        run: |
          echo '{"private": true, "workspaces": ["agenteca-core", "agenteca-cli", "agenteca-registry"]}' > package.json
          npm install --no-audit --no-fund
      - name: Build agenteca-core
        run: npm run build -w agenteca-core
      - name: Build agenteca-cli
        run: npm run build -w agenteca-cli
      - name: ahub launcher
        run: |
          printf '#!/bin/sh\nexec node %s/agenteca-cli/dist/bin.js "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/ahub"
          chmod +x "$RUNNER_TEMP/ahub"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Security scan (SARIF report)
        # The report is written outside the repository: it quotes the dangerous patterns and would itself be flagged by the scan.
        run: ahub scan . --format sarif --output "$RUNNER_TEMP/ahub.sarif" || true
        working-directory: agenteca-registry
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/ahub.sarif
          category: ahub
          checkout_path: agenteca-registry
      - name: Refuse any critical finding
        run: ahub scan .
        working-directory: agenteca-registry
      - name: The example package installs and uninstalls on the four tools
        run: scripts/check-example.sh
        working-directory: agenteca-registry
      - name: The native marketplaces are up to date
        run: scripts/export.sh && git diff --exit-code
        working-directory: agenteca-registry
