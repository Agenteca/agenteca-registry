name: hello-agent
version: 0.1.0
description: Paquet d'exemple Agenteca — une primitive de chaque type, pour vérifier une installation.
author: Agenteca
license: Apache-2.0

dependencies:
  mcp:
    # Serveur de référence du projet MCP (mémoire locale). Il est lancé par l'outil,
    # pas à l'installation ; ahub montre cette commande avant de l'écrire.
    - name: hello-memory
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-memory"]
