name: hello-agent
version: 0.1.1
description: Agenteca example package — one primitive of each type, to check an installation.
author: Agenteca
license: Apache-2.0

dependencies:
  mcp:
    # Reference server of the MCP project (local memory). It is started by the tool,
    # not at installation; ahub shows this command before writing it.
    - name: hello-memory
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-memory"]
